version: 2
updates:
  # One npm entry. The workspace lockfile lives at the root, so per-package
  # entries open duplicate pull requests for the same bump.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      ttsc:
        patterns:
          - "ttsc"
          - "@ttsc/*"
          - "typia"
          - "@typia/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
