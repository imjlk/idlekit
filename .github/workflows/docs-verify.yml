name: Docs Verify

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same pull request or branch replaces the run already in progress.
# The pull request number keeps two forks that share a branch name from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify Docs
        run: bun run docs:verify
