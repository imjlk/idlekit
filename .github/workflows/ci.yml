name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same pull request or branch replaces the run already in progress.
# The pull request number keeps two forks that share a branch name from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GITHUB_BEFORE: ${{ github.event.before }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Smoke still uses a fresh plugin directory, so the cold/warm assertion stays.
      # The Go object cache is the part that otherwise recompiles for several minutes.
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
      # After Build, replay and KPI run dist/main.js instead of rebuilding ttsc per command.
      IDLEKIT_CLI_DIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup npm for release smoke
        run: npm install -g npm@12.2.0

      - name: Cache ttsc plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Fetch the revision before this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.before }}

      - name: Cold protected typecheck
        env:
          TTSC_CACHE_DIR: ${{ runner.temp }}/idlekit-cold-typecheck
        run: bun run typecheck

      - name: Toolchain smoke
        run: |
          bun test tools/_bun.test.ts tools/compiler-bin.test.ts tools/evidence/program.test.ts tools/evidence/source-lock.test.ts
          bun test tools/release-workflow.test.ts tools/release-lockfile.test.ts tools/npm-pack.test.ts tools/tarball-check.test.ts
          bun run toolchain:smoke

      - name: Graph check
        run: bun run graph:check

      - name: Typecheck
        run: bun run typecheck

      - name: Evidence smoke
        run: bun run evidence:smoke

      - name: Evidence runner regression tests
        run: bun test tools/evidence/runner-registry.test.ts

      - name: Gunshi Command Check
        run: bun run --cwd packages/cli generate:check

      - name: Shell Completion Check
        run: bun run --cwd packages/cli doctor:completions

      - name: Runtime Import Check
        run: bun run runtime:check

      - name: Test
        run: bun run test

      - name: Conformance
        run: bun run test:conformance

      - name: Build
        run: bun run build

      - name: Release Dry Run
        run: bun run release:dry-run

      - name: Perf Check (simulate benchmark)
        run: bun run bench:sim:check

      - name: Perf Check (simulate benchmark suite)
        run: bun run bench:sim:suite:check

      - name: Template Governance Check
        run: bun run templates:check

      - name: Install Smoke
        run: bun run install:smoke

      - name: README Smoke
        run: bun run readme:smoke

      - name: Compatibility Check
        run: bun run compat:check

      - name: Public Readiness Check
        run: bun run public:check

      - name: Replay Verify Gate
        run: bun run replay:verify

      - name: KPI AB Report
        run: bun run kpi:report

      - name: KPI Regression Gate
        run: bun run kpi:regress

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Windows toolchain
        run: |
          bun run toolchain:doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tools/_bun.test.ts tools/compiler-bin.test.ts tools/evidence/program.test.ts tools/tarball-check.test.ts

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Typecheck tools
        run: bun run typecheck:tools

      - name: Windows CLI tests
        run: bun run --cwd packages/cli test

      - name: Session clock regression tests
        working-directory: packages/core
        run: bun test src/sim/session.test.ts

      - name: Install smoke
        run: bun run install:smoke

      - name: Public package readiness
        run: bun run public:check

      - name: Gunshi command tree
        run: bun run --cwd packages/cli generate:check

      - name: Bundled CLI and PowerShell completion
        run: |
          bun packages/cli/dist/main.js --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/cli/dist/main.js validate examples/tutorials/01-cafe-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $completion = bun packages/cli/dist/main.js complete powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($completion -join "`n") -notmatch "Register-ArgumentCompleter") { throw "Missing PowerShell completion registration" }

      - name: Build native CLI
        run: bun run --cwd packages/cli build:bin

      - name: Native simulation and replay
        shell: pwsh
        run: |
          $cliPath = (Resolve-Path packages/cli/dist/bin/idk.exe).Path
          & $cliPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          & $cliPath simulate examples/tutorials/01-cafe-baseline.json --duration 30 --step 1 --seed 101 --run-id windows-ci --artifact-out tmp/windows-native-replay.json --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replayOutput = & $cliPath replay verify tmp/windows-native-replay.json --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($replayOutput -join "`n") | ConvertFrom-Json
          if ($replay.ok -ne $true) { throw "Native replay verification failed" }
          $replayOutput
