name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The Release workflow dispatches this on release/main, whose GITHUB_TOKEN pushes start no pull_request runs.
  workflow_dispatch:

# A new push to the same pull request or branch replaces the run already in progress.
# The pull request number keeps two forks that share a branch name from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Linux jobs run in parallel. The ttsc cache key follows fixtures/toolchain/pins.json, which pins
# every package that builds a ttsc plugin, so release merges that only bump workspace versions in
# bun.lock reuse it. Only the typecheck job saves it; the other jobs restore it.
jobs:
  # Runs the same pinned Sampo action and core as the Release prepare job, so a changeset that
  # prepare would reject fails here first.
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned cargo-binstall
        uses: ./.github/actions/cargo-binstall

      - name: Validate changesets with the release Sampo
        uses: bruits/sampo/crates/sampo-github-action@11306bad0caaa58c8a36fa203695c5f2cacc4344 # action 0.20.0, core 0.18.0
        with:
          command: release
          dry-run: "true"
        env:
          SAMPO_RELEASE_BRANCH: main
          BINSTALL_STRATEGIES: crate-meta-data
          BINSTALL_DISABLE_TELEMETRY: "true"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Smoke still uses a fresh plugin directory, so the cold/warm assertion stays.
      # The Go object cache is the part that otherwise recompiles for several minutes.
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup npm for release smoke
        run: npm install -g npm@12.2.0

      - name: Source audit check
        run: bun tools/analysis-baseline-check.ts

      - name: Runtime Import Check
        run: bun run runtime:check

      - name: Restore ttsc plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('fixtures/toolchain/pins.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      # Every tools test runs by directory, so a new one is picked up without editing this list.
      # The negative conformance test is a protected inventory binding that evidence:check runs in
      # the typecheck job; Windows runs it directly.
      - name: Tools tests
        run: bun test ./tools --path-ignore-patterns='tools/conformance.negative.test.ts'

      - name: Toolchain smoke
        run: bun run toolchain:smoke

      - name: Contracts Check
        run: bun run contracts:check

      - name: Gunshi Command Check
        run: bun run --cwd packages/cli generate:check

      - name: Shell Completion Check
        run: bun run --cwd packages/cli doctor:completions

      - name: Template Governance Check
        run: bun run templates:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_BEFORE: ${{ github.event.before }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Cache ttsc plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('fixtures/toolchain/pins.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Fetch the revision before this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.before }}

      # A fresh plugin directory proves the protected typecheck builds its plugins from source.
      # It is the only typecheck: a second run on the restored plugin directory repeated the
      # ~9-minute evidence inventory without checking anything the cold run does not.
      - name: Cold protected typecheck
        env:
          TTSC_CACHE_DIR: ${{ runner.temp }}/idlekit-cold-typecheck
        run: bun run typecheck

      # The cold run built its plugins in a temporary directory. Link them into the shared plugin
      # directory from the warm Go cache, so the entry this job saves serves the other jobs.
      - name: Prepare shared ttsc plugins
        run: bun run toolchain:prepare

      - name: Graph check
        run: bun run graph:check

      - name: Evidence smoke
        run: bun run evidence:smoke

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Restore ttsc plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('fixtures/toolchain/pins.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      - name: Test
        run: bun run test

      - name: Conformance
        run: bun run test:conformance

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
      # After Build, replay and KPI run dist/main.js instead of rebuilding ttsc per command.
      IDLEKIT_CLI_DIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup npm for release smoke
        run: npm install -g npm@12.2.0

      - name: Restore ttsc plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('fixtures/toolchain/pins.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      - name: Build
        run: bun run build

      - name: Release Dry Run
        run: bun run release:dry-run

      - name: Perf Check (representative benchmark)
        run: bun run bench:sim:check

      - name: Install Smoke
        run: bun run install:smoke

      - name: README Smoke
        run: bun run readme:smoke

      - name: Compatibility Check
        run: bun run compat:check

      - name: Public Readiness Check
        run: bun run public:check

      - name: Replay Verify Gate
        run: bun run replay:verify

      - name: KPI AB Report
        run: bun run kpi:report

      - name: KPI Regression Gate
        run: bun run kpi:regress

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Windows toolchain
        run: |
          bun run toolchain:doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun tools/analysis-baseline-check.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tools/_bun.test.ts tools/compiler-bin.test.ts tools/compiler-call-check.test.ts tools/toolchain-host.test.ts tools/evidence/program.test.ts tools/evidence/source-graph.test.ts tools/tarball-check.test.ts

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Typecheck tools
        run: bun run typecheck:tools

      - name: Windows CLI tests
        run: bun run --cwd packages/cli test

      - name: Windows contract CLI regressions
        working-directory: packages/core
        run: bun test src/scenario/scenarioContract.test.ts

      - name: Windows negative conformance regressions
        run: bun test tools/conformance.negative.test.ts

      - name: Windows session, module, and public clock regressions
        working-directory: packages/core
        run: bun test src/sim/session.test.ts src/sim/analysis/goalValidation.test.ts src/scenario/timeBoundaryRegression.test.ts

      - name: Install smoke
        run: bun run install:smoke

      - name: Public package readiness
        run: bun run public:check

      - name: Gunshi command tree
        run: bun run --cwd packages/cli generate:check

      - name: Bundled CLI and PowerShell completion
        run: |
          bun packages/cli/dist/main.js --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/cli/dist/main.js validate examples/tutorials/01-cafe-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $completion = bun packages/cli/dist/main.js complete powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($completion -join "`n") -notmatch "Register-ArgumentCompleter") { throw "Missing PowerShell completion registration" }

      - name: Build native CLI
        run: bun run --cwd packages/cli build:bin

      - name: Native simulation and replay
        shell: pwsh
        run: |
          $cliPath = (Resolve-Path packages/cli/dist/bin/idk.exe).Path
          & $cliPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          & $cliPath simulate examples/tutorials/01-cafe-baseline.json --duration 30 --step 1 --seed 101 --run-id windows-ci --artifact-out tmp/windows-native-replay.json --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replayOutput = & $cliPath replay verify tmp/windows-native-replay.json --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($replayOutput -join "`n") | ConvertFrom-Json
          if ($replay.ok -ne $true) { throw "Native replay verification failed" }
          $replayOutput

  # macOS links TMPDIR through /var -> /private/var; Linux and Windows never exercise that path.
  macos-cli:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node (ttsc launcher)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: macOS toolchain
        run: |
          bun run toolchain:doctor
          bun test tools/_bun.test.ts tools/compiler-bin.test.ts tools/package-manifest.test.ts

      - name: macOS CLI tests
        run: bun run --cwd packages/cli test

      - name: Install smoke
        run: bun run install:smoke
