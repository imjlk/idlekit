name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  # The Release workflow dispatches this on release/main, whose GITHUB_TOKEN pushes start no pull_request runs.
  workflow_dispatch:

# A new push to the same pull request or branch replaces the run already in progress.
# The pull request number keeps two forks that share a branch name from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTSC_GO_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      # CI's typecheck job saves this entry; the ttsc build of the CLI reuses its plugins.
      - name: Restore ttsc plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc/plugins
            node_modules/.cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('fixtures/toolchain/pins.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-

      - name: Build
        run: bun run build

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
